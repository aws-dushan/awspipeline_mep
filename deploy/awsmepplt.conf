# /awsmepplt — the Pipeline Tracker.
#
# The prefix is KEPT. Next.js writes the base path into every asset URL,
# Server Action endpoint and <Link> at build time, so stripping it here would
# deliver the HTML and 404 every script behind it. The prefix is passed
# through untouched and the image is built with APP_BASE_PATH=/awsmepplt to
# match. The two must agree; changing one alone breaks the page.
#
# The database lives on AWS-Data and is reached server-side over the internal
# network. A browser never sees a database address, and there is no separate
# API origin, so nothing here needs CORS.
#
# This file is installed onto the shared edge by the deploy, and does not
# stay there by itself: sync-infra.sh reconciles /opt/aws/edge/apps against
# the platform's infrastructure image and deletes any route that image does
# not carry, which took this application off the air twice on 2026-09-18.
# Rather than move the route into that image - which would tie a deploy of
# this project to a commit in another one - the deploy installs
# deploy/route-guard.sh, which puts the route back within twenty seconds of
# it being removed. This file is the source it restores from.

location /awsmepplt {
	set $upstream_mepplms "mepplms:3000";
	proxy_pass http://$upstream_mepplms;

	# RSC payloads and Server Action responses stream. Buffered, the page
	# would appear only once it had finished arriving.
	proxy_buffering off;
}

# The live grid.
#
# A Server-Sent Events stream, held open for as long as the tab is. The
# global proxy_read_timeout of 120s would cut it, and although the client
# reconnects, each reconnect re-runs the session check and re-subscribes for
# no reason. The stream sends a keep-alive comment every 25 seconds, so an
# hour of silence here means the connection is genuinely dead.
location /awsmepplt/api/companies {
	set $upstream_mepplms_sse "mepplms:3000";
	proxy_pass http://$upstream_mepplms_sse;

	proxy_buffering off;
	proxy_cache off;
	proxy_read_timeout 1h;
	proxy_send_timeout 1h;
	# Some intermediaries buffer regardless; this is the opt-out they honour.
	add_header X-Accel-Buffering no always;

	# Repeated, not inherited. One add_header in a location replaces the whole
	# inherited set, so naming the one above would otherwise drop the server
	# block's three security headers from every response on this path.
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options    nosniff always;
	add_header Referrer-Policy           no-referrer always;
}
