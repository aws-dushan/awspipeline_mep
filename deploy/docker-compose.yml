# Pipeline Management System - deployment on AWS-App.
#
# A project of its own rather than a service inside /opt/aws/docker-compose.app.yml,
# because that file is generated by the infrastructure sync and an entry added
# by hand there does not survive the next run. Joining the same network from
# outside gets the same result and leaves that file alone.
name: aws-mepplms

services:
  mepplms:
    build:
      context: ./src
      args:
        # Must match the nginx `location` in awsmepplms.conf. Compiled in.
        APP_BASE_PATH: /awsmepplms
    image: aws-mepplms:latest
    container_name: mepplms
    restart: unless-stopped

    # No published port, deliberately. The edge reaches it over the shared
    # network at mepplms:3000 and nothing else can, so the TLS edge cannot be
    # bypassed by anything on the host.
    env_file: [.env]

    networks: [aws-app]

    healthcheck:
      # The login page is public and server-rendered, so a 200 here means the
      # process is up, Next is serving and the base path is wired correctly.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/awsmepplms/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits: { memory: 1G, cpus: '2' }

    logging:
      driver: json-file
      options: { max-size: 20m, max-file: '5' }

networks:
  # Created by the aws-app project; joined, never owned.
  aws-app:
    external: true
    name: aws-app_aws-app
